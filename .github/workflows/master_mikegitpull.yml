name: Build HelloWorldCalculator Exe

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name HelloWorldCalculator Calculator.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorldCalculator-windows
          path: dist/HelloWorldCalculator/
          if-no-files-found: error
