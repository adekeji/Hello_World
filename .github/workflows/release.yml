name: Release HelloWorldCalculator

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build portable folder executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name HelloWorldCalculator Calculator.py
          Compress-Archive -Path dist/HelloWorldCalculator/* -DestinationPath dist/HelloWorldCalculator-portable.zip -Force

      - name: Build single-file executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name HelloWorldCalculator Calculator.py

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HelloWorldCalculator.exe
            dist/HelloWorldCalculator-portable.zip
          generate_release_notes: true
